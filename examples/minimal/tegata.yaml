# The smallest tegata setup: no cloud account and no external providers.
# Secrets go to ./store (plain-text JSON files; for trying tegata only).

stores:
  main:
    local:
      dir: ./store

identities:
  app:
    members: [serviceAccount:app@example.iam.gserviceaccount.com]
    templates: ./templates/app      # check compares them with what app can read

resources:
  session_key:
    provider: random
    config: { bytes: 32 }
    stores:
      main:
        - { name: SESSION_KEY, readers: [app] }
    previous: { name: PREVIOUS_SESSION_KEY }   # read by the readers of SESSION_KEY
  admin_password:
    provider: manual
    stores:
      main:
        - { name: ADMIN_PASSWORD, readers: [app] }
  mail:
    provider: value
    config: { from: "Example <noreply@example.com>" }
    stores:
      main:
        - { output: from, name: MAIL_FROM, readers: [app] }

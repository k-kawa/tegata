[package]
name = "tegata"
description = "秘密を作り、置き、入れ替え、雛形を埋める道具"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
tegata-plugin = { path = "../tegata-plugin" }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "form", "rustls-no-provider"] }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "fs"] }

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

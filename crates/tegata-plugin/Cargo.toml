[package]
name = "tegata-plugin"
description = "Types of the tegata provider protocol (JSON over stdin and stdout) and a helper for writing providers"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
license = "FSL-1.1-ALv2"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-std", "io-util", "rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

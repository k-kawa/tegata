[package]
name = "tegata-plugin"
description = "tegata とプロバイダーの約束（標準入出力の JSON）の型と、プロバイダーを書くための助け"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-std", "io-util", "rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

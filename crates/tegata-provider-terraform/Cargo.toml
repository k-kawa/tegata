[package]
name = "tegata-provider-terraform"
description = "tegata のプロバイダー：terraform"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "FSL-1.1-ALv2"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
tegata-plugin = { path = "../tegata-plugin" }
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process"] }

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
